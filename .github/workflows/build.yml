name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify server runs
        run: |
          npx tsx app.ts &
          SERVER_PID=$!
          sleep 5
          curl -f http://localhost:3000
          kill $SERVER_PID

      - name: Run tests
        run: npm test
